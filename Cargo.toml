[package]
name = "tauri-plugin-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Render GPUI views inside ordinary Tauri windows"
license = "MIT"
repository = "https://github.com/ziinc/tauri-gpui"
homepage = "https://github.com/ziinc/tauri-gpui"
documentation = "https://docs.rs/tauri-plugin-gpui"
readme = "README.md"
exclude = [".github", "docs"]
keywords = ["tauri", "tauri-plugin", "gpui", "gui"]
categories = ["gui"]

[workspace]
# The demo is its own workspace so gpui-kit (a demo-only dependency) never
# enters this crate's lockfile or `--workspace` builds.
exclude = ["examples/gpui-demo"]

[features]
default = []
# iOS/Android support via gpui-mobile. Off by default so desktop-only
# consumers never compile the mobile dependency graph.
mobile = ["dep:gpui-mobile"]

[dependencies]
anyhow = "1"
futures = "0.3"
log = "0.4"
raw-window-handle = "0.6"
thiserror = "2"
uuid = "1"
tauri = { version = "2.12", features = ["unstable"] }
tauri-runtime-wry = { version = "2.12", features = ["unstable"] }
# GPUI from crates.io: `gpui-pre` is a published snapshot of zed's gpui (the
# same crates gpui-kit / gpui-component build on). Renamed so code says `gpui`.
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui-mobile = { version = "0.1", optional = true }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "pnm"] }
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.8" }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.8", features = ["font-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation"] }

[dev-dependencies]
tauri = { version = "2.12", features = ["unstable", "test"] }
tauri-plugin-clipboard-manager = "2"

# Chaos/integration suite: drives a real Tauri event loop, which must own the
# main thread, so it uses its own harness. Skips without a display.
[[test]]
name = "chaos"
harness = false
