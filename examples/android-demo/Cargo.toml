[package]
name = "android-demo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# `cdylib` is what Android loads; `rlib` keeps `cargo run` working on desktop.
name = "android_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-gpui = { path = "../..", features = ["mobile"] }
gpui-kit = "0.7.1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
