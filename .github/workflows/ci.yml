name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev mesa-vulkan-drivers \
            libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libpipewire-0.3-dev \
            libgbm-dev libegl-dev libxrandr-dev clang fonts-dejavu xvfb openbox xdotool
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Integration/chaos tests (real Tauri event loop on Xvfb)
        run: scripts/integration-test.sh
        timeout-minutes: 15
      - name: Screenshot test (examples/gpui-demo)
        run: examples/gpui-demo/scripts/screenshot-test.sh target/gpui-demo-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpui-demo-screenshots
          path: target/gpui-demo-screenshots
